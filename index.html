<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flight Booker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-group">
            <label for="flight-type">Flight type:</label>
            <select id="flight-type">
                <option value="one-way">One-way flight</option>
                <option value="round-trip">Round-trip flight</option>
            </select>
        </div>
        <div class="form-group">
            <label for="departure-date">Departure date:</label>
            <input type="date" id="departure-date">
        </div>
        <div class="form-group">
            <label for="return-date">Return date:</label>
            <input type="date" id="return-date" disabled>
        </div>
        <div class="form-group">
            <button id="book-button" disabled>Book flight</button>
            <button id="cancel-button" disabled>Cancel flight</button>
        </div>
    </div>  
    <script src="script.js"></script>
</body>
</html>
